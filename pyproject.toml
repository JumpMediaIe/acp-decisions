[project]
name = "acp-decisions"
version = "0.1.0"
description = "An Coimisiún Pleanála appeal decisions archive"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "PyYAML>=6.0",
    "rich>=13.9",
    "python-slugify>=8.0",
    "pypdf>=6.0",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pillow>=11",
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyright>=1.1.391",
]

[project.scripts]
acp = "acp_decisions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers"]
